[package]
name = "kvboost_native"
version = "0.1.0"
edition = "2021"
description = "Native (Rust) hot-path components for kvboost"
license = "MIT"

[lib]
name = "kvboost_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
